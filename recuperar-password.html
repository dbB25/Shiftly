<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiftly - Recuperar Contraseña</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Estilos Propios -->
    <link rel="stylesheet" href="style.css">
</head>

<body style="background-color: #DAE0F2; font-family: sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column;">

    <!-- NAVBAR BLANCO CON SOMBRA -->
    <header class="bg-white shadow-sm sticky-top py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold fs-3 text-decoration-none" href="index.html" style="color: #111344;">
                <img src="img_log/logotipo interfaz.svg" alt="Logo Shiftly" width="40" height="40">
                <span>Shiftly</span>
            </a>

            <div class="d-flex gap-4 fw-semibold">
                <a href="login.html" class="text-decoration-none" style="color: #111344;">Volver al Login</a>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="py-5 flex-grow-1 d-flex align-items-center">
        <div class="container" style="max-width: 500px;">
            
            <div class="card border-0 shadow-sm p-4 p-md-5 rounded-4 text-center" style="background-color: #FFFFFF;">
                
                <!-- Icono Destacado -->
                <div class="rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 70px; height: 70px; background-color: #EFE9E7; color: #52154E; font-size: 32px;">
                    <i class="bi bi-key-fill"></i>
                </div>

                <!-- Encabezado -->
                <div class="mb-4">
                    <p class="text-uppercase fw-bold small mb-1" style="color: #52154E; letter-spacing: 1px;">RECUPERACIÓN DE ACCESO</p>
                    <h1 class="h3 fw-bold mb-2" style="color: #111344;">¿Olvidaste tu contraseña?</h1>
                    <p class="small text-muted mb-0">Ingresa tu correo electrónico registrado y te enviaremos un enlace para restablecerla.</p>
                </div>

                <!-- Formulario -->
                <form class="text-start">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold small" style="color: #111344;">Correo Electrónico</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                            <input type="email" id="email" class="form-control border-start-0 bg-light" placeholder="ejemplo@correo.com" required>
                        </div>
                    </div>

                    <button type="button" class="btn text-white rounded-pill w-100 py-2 fw-semibold mt-2" style="background-color: #52154E; border-color: #52154E;">
                        Enviar Enlace de Recuperación
                    </button>
                </form>

                <!-- Footer del Formulario -->
                <div class="mt-4 pt-3 border-top">
                    <a href="login.html" class="small text-decoration-none fw-semibold" style="color: #52154E;">
                        <i class="bi bi-arrow-left me-1"></i> Regresar al Inicio de Sesión
                    </a>
                </div>

            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-white border-top py-3 mt-auto text-center">
        <p class="mb-0 text-muted small">&copy; 2026 Shiftly. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
