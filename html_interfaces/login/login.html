<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiftly - Iniciar Sesión</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="container">
            <!-- CORREGIDO: Redirección del logo a ../index/index.html -->
            <a class="navbar-brand" href="../index/index.html">
                <img src="img_log/logotipo interfaz.svg"
                     alt="Logo Shiftly"
                     class="logo-shiftly">
                <span>Shiftly</span>
            </a>

            <div class="navbar-links">
                <!-- CORREGIDO: Redirección correcta a la carpeta index -->
                <a href="../index/index.html">Inicio</a>
                <a href="registro.html">Registrarse</a>
            </div>
        </div>
    </header>

    <!-- Formulario de inicio de sesión -->
    <main class="vista-autenticacion">
        <div class="contenedor-autenticacion">

            <div class="tarjeta-autenticacion">
                <div class="encabezado-auth">
                    <p class="etiqueta-resultado">¡BIENVENIDO DE NUEVO!</p>
                    <h1>Iniciar Sesión</h1>
                    <p class="subtitulo-resultado">
                        Accede a tu cuenta para continuar aprendiendo.
                    </p>
                </div>

                <form class="formulario-auth" id="formularioLogin">

                    <div class="campo-auth">
                        <label for="email" class="label-auth">
                            Correo Electrónico
                        </label>

                        <div class="caja-input">
                            <i class="bi bi-envelope icon-input"></i>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="input-auth"
                                placeholder="ejemplo@correo.com"
                                autocomplete="email"
                                required>
                        </div>
                    </div>

                    <div class="campo-auth">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="password" class="label-auth mb-0">
                                Contraseña
                            </label>

                            <a href="recuperar-password.html"
                               class="enlace-secundario">
                                ¿Olvidaste tu contraseña?
                            </a>
                        </div>

                        <div class="caja-input">
                            <i class="bi bi-lock icon-input"></i>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="input-auth"
                                placeholder="Ingresa tu contraseña"
                                autocomplete="current-password"
                                required>

                            <button
                                type="button"
                                id="mostrarPassword"
                                class="btn border-0"
                                aria-label="Mostrar contraseña"
                                aria-pressed="false">
                                <i class="bi bi-eye" id="iconoPassword"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Mensajes del formulario -->
                    <div
                        id="mensajeLogin"
                        class="alert d-none mt-3"
                        role="status"
                        aria-live="polite">
                    </div>

                    <button
                        type="submit"
                        class="btn-resultado btn-siguiente w-100 mt-2">
                        Iniciar Sesión
                    </button>

                </form>

                <div class="pie-auth">
                    <p class="text-muted">
                        ¿Aún no tienes una cuenta?
                        <a href="registro.html" class="enlace-primario">
                            Regístrate aquí
                        </a>
                    </p>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="footer-simple">
        <div class="container d-flex flex-column flex-md-row align-items-center justify-content-between gap-2">
            <p class="mb-0 text-muted small">
                &copy; 2026 Shiftly. Todos los derechos reservados.
            </p>
        </div>
    </footer>

    <script src="../../js/login.js"></script>

</body>
</html>
