<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiftly - Recuperar Contraseña</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Estilos Propios -->
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body style="background-color: #DAE0F2; font-family: sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column;">

    <!-- NAVBAR BLANCO CON SOMBRA -->
    <header class="bg-white shadow-sm sticky-top py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold fs-3 text-decoration-none" href="../index/index.html" style="color: #111344;">
                <img src="../../img_log/logotipo interfaz.svg" alt="Logo Shiftly" width="40" height="40">
                <span>Shiftly</span>
            </a>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="py-5 flex-grow-1 d-flex align-items-center">
        <div class="container" style="max-width: 500px;">
            
            <div class="card border-0 shadow-sm p-4 p-md-5 rounded-4 text-center" style="background-color: #FFFFFF;">
                
                <!-- Icono Destacado -->
                <div class="rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 70px; height: 70px; background-color: #EFE9E7; color: #52154E; font-size: 32px;">
                    <i class="bi bi-key-fill"></i>
                </div>

                <!-- Encabezado -->
                <div class="mb-4">
                    <p class="text-uppercase fw-bold small mb-1" style="color: #52154E; letter-spacing: 1px;">ACCESO A TU CUENTA</p>
                    <h1 class="h3 fw-bold mb-2" style="color: #111344;">¿Olvidaste tu contraseña?</h1>
                    <p class="small text-muted mb-0">Ingresa tu correo electrónico registrado para enviarte las instrucciones y el código de verificación.</p>
                </div>

                <!-- Contenedor para Mensajes Dinámicos -->
                <div id="mensajeRecuperacion" class="alert d-none text-start mb-3" role="alert"></div>

                <!-- Formulario de Recuperación -->
                <form id="formRecuperar">
                    <div class="mb-4 text-start">
                        <label for="correoRecuperacion" class="form-label small fw-bold" style="color: #111344;">Correo Electrónico</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0" style="border-color: #CBD5E1;"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" id="correoRecuperacion" class="form-control border-start-0" style="border-color: #CBD5E1;" placeholder="ejemplo@correo.com" required>
                        </div>
                    </div>

                    <button type="submit" id="btnEnviarEnlace" class="btn text-white rounded-pill w-100 py-2 fw-semibold" style="background-color: #52154E; border-color: #52154E;">
                        Enviar Enlace
                    </button>
                </form>

                <!-- Volver al Login -->
                <div class="mt-4 pt-3 border-top">
                    <p class="small text-muted mb-0">¿Recordaste tu contraseña? <a href="login.html" class="fw-bold text-decoration-none" style="color: #52154E;">Iniciar Sesión</a></p>
                </div>

            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-white border-top py-3 mt-auto text-center">
        <p class="mb-0 text-muted small">&copy; 2026 Shiftly. Todos los derechos reservados.</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script Lógico de Autenticación -->
    <script src="../../js/recuperacion-password.js"></script>
</body>

</html>
