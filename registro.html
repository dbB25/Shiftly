
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shiftly - Registro</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
            background-color: #DAE0F2;
            color: #111344;
        }

        header {
            background-color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 3px 12px #11134412;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: #111344;
            text-decoration: none;
            font-size: 34px;
            font-weight: bold;
        }

        .logo img {
            width: 44px;
            height: 44px;
            object-fit: contain;
        }

        .enlace-login {
            display: block;
            margin-top: 18px;
            color: #111344;
            text-decoration: none;
            font-weight: bold;
            font-size: 19px;
        }

        main {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            padding: 45px 30px;
            flex: 1;
        }

        .etiqueta {
            color: #52154E;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: clamp(38px, 6vw, 54px);
            color: #111344;
            margin-bottom: 16px;
        }

        .subtitulo {
            font-size: 20px;
            margin-bottom: 26px;
        }

        .campo {
            margin-bottom: 15px;
        }

        .campo label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .caja-input {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .caja-input > i {
            font-size: 20px;
            color: #111344;
        }

        .caja-input input {
            width: 100%;
            max-width: 420px;
            min-width: 0;
            padding: 9px 10px;
            border: 1px solid #777;
            border-radius: 3px;
            font-size: 19px;
            background-color: white;
            color: #111344;
        }

        .caja-input input:focus {
            outline: 2px solid #52154E;
            outline-offset: 1px;
        }

        .caja-input input:valid:not(:placeholder-shown) {
            border: 2px solid #198754;
        }

        .caja-input input:invalid:not(:placeholder-shown) {
            border: 2px solid #dc3545;
        }

        .boton-ojo {
            border: none;
            background: transparent;
            color: #111344;
            padding: 8px;
            font-size: 21px;
            cursor: pointer;
        }

        .boton-crear {
            display: block;
            width: 100%;
            padding: 17px;
            margin-top: 22px;
            border: none;
            border-radius: 40px;
            background-color: #52154E;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
        }

        .boton-crear:hover {
            background-color: #111344;
            transform: translateY(-2px);
        }

        .boton-crear:focus-visible,
        .boton-ojo:focus-visible {
            outline: 3px solid #111344;
            outline-offset: 3px;
        }

        .pie-formulario {
            margin-top: 8px;
            font-size: 19px;
        }

        .pie-formulario a {
            color: #52154E;
            font-weight: bold;
            text-decoration: none;
        }

        .pie-formulario a:hover {
            text-decoration: underline;
        }

        #mensajeRegistro {
            margin-top: 18px;
            padding: 14px;
            border-radius: 7px;
            display: none;
            line-height: 1.5;
        }

        #mensajeRegistro.visible {
            display: block;
        }

        .mensaje-error {
            background-color: #F8D7DA;
            border: 1px solid #F1AEB5;
            color: #842029;
        }

        .mensaje-exito {
            background-color: #CFF4FC;
            border: 1px solid #9EEAF9;
            color: #055160;
        }

        footer {
            text-align: center;
            color: #606779;
            padding: 24px 15px;
        }

        @media (max-width: 500px) {
            main {
                padding: 35px 20px;
            }

            .logo {
                font-size: 30px;
            }

            .subtitulo {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- Encabezado -->
    <header>
        <a class="logo" href="index.html">
            <img
                src="img_log/logotipo interfaz.svg"
                alt="Logo de Shiftly">
            <span>Shiftly</span>
        </a>

        <a class="enlace-login" href="login.html">
            Iniciar Sesión
        </a>
    </header>

    <!-- Formulario de registro -->
    <main>
        <p class="etiqueta">EMPIEZA HOY</p>

        <h1>Crear Cuenta</h1>

        <p class="subtitulo">
            Únete a Shiftly y potencia tu inglés técnico.
        </p>

        <form id="formularioRegistro">

            <!-- Nombre -->
            <div class="campo">
                <label for="nombre">Nombre Completo</label>

                <div class="caja-input">
                    <i class="bi bi-person" aria-hidden="true"></i>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Tu nombre"
                        autocomplete="name"
                        minlength="3"
                        required>
                </div>
            </div>

            <!-- Correo -->
            <div class="campo">
                <label for="correo">Correo Electrónico</label>

                <div class="caja-input">
                    <i class="bi bi-envelope" aria-hidden="true"></i>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="ejemplo@correo.com"
                        autocomplete="email"
                        required>
                </div>
            </div>

            <!-- Contraseña -->
            <div class="campo">
                <label for="password">Contraseña</label>

                <div class="caja-input">
                    <i class="bi bi-lock" aria-hidden="true"></i>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Mínimo 8 caracteres"
                        autocomplete="new-password"
                        minlength="8"
                        required>

                    <button
                        type="button"
                        id="mostrarPassword"
                        class="boton-ojo"
                        aria-label="Mostrar contraseña"
                        aria-pressed="false">

                        <i
                            class="bi bi-eye"
                            id="iconoPassword"
                            aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <!-- Mensaje dinámico -->
            <div
                id="mensajeRegistro"
                role="status"
                aria-live="polite">
            </div>

            <!-- Botón -->
            <button type="submit" class="boton-crear">
                Crear Mi Cuenta
            </button>

            <p class="pie-formulario">
                ¿Ya tienes una cuenta?
                <a href="login.html">Inicia sesión</a>
            </p>

        </form>
    </main>

    <!-- Pie de página -->
    <footer>
        &copy; 2026 Shiftly. Todos los derechos reservados.
    </footer>

    <!-- JavaScript: interacciones -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const formulario =
                document.getElementById("formularioRegistro");

            const nombre =
                document.getElementById("nombre");

            const correo =
                document.getElementById("correo");

            const password =
                document.getElementById("password");

            const botonMostrar =
                document.getElementById("mostrarPassword");

            const iconoPassword =
                document.getElementById("iconoPassword");

            const mensaje =
                document.getElementById("mensajeRegistro");


            // INTERACCIÓN 1:
            // Mostrar u ocultar la contraseña

            botonMostrar.addEventListener("click", function () {

                const mostrar = password.type === "password";

                password.type = mostrar ? "text" : "password";

                iconoPassword.className = mostrar
                    ? "bi bi-eye-slash"
                    : "bi bi-eye";

                botonMostrar.setAttribute(
                    "aria-label",
                    mostrar
                        ? "Ocultar contraseña"
                        : "Mostrar contraseña"
                );

                botonMostrar.setAttribute(
                    "aria-pressed",
                    String(mostrar)
                );
            });


            // Función para mostrar notificaciones

            function mostrarMensaje(texto, tipo) {

                mensaje.textContent = texto;

                mensaje.className = "visible " + tipo;
            }


            // INTERACCIÓN 2:
            // Validación del formulario

            formulario.addEventListener("submit", function (evento) {

                evento.preventDefault();

                if (!formulario.checkValidity()) {

                    formulario.reportValidity();

                    mostrarMensaje(
                        "Revisa los campos. Ingresa un nombre, un correo válido y una contraseña de al menos 8 caracteres.",
                        "mensaje-error"
                    );

                    return;
                }

                if (nombre.value.trim().length < 3) {

                    mostrarMensaje(
                        "Escribe tu nombre completo con al menos 3 caracteres.",
                        "mensaje-error"
                    );

                    nombre.focus();

                    return;
                }

                mostrarMensaje(
                    "Los datos se validaron correctamente. La creación real de la cuenta requiere conectar un servidor.",
                    "mensaje-exito"
                );
            });


            // INTERACCIÓN 3:
            // Actualizar la notificación cuando cambian los datos

            formulario.addEventListener("input", function () {

                mensaje.textContent = "";

                mensaje.className = "";

                mensaje.style.display = "none";
            });

        });
    </script>

<script>
    // Obtener el formulario y sus campos
    const formularioRegistro = document.querySelector("form");
    const nombre = formularioRegistro.querySelector('input[type="text"]');
    const correo = formularioRegistro.querySelector('input[type="email"]');
    const contrasena = formularioRegistro.querySelector('input[type="password"]');

    // Crear un espacio para mostrar mensajes
    const mensajeRegistro = document.createElement("div");
    mensajeRegistro.className = "alert d-none mt-3";
    mensajeRegistro.setAttribute("role", "status");
    mensajeRegistro.setAttribute("aria-live", "polite");

    formularioRegistro.appendChild(mensajeRegistro);

    // Función para mostrar mensajes
    function mostrarMensajeRegistro(texto, tipo) {
        mensajeRegistro.textContent = texto;
        mensajeRegistro.className = "alert alert-" + tipo + " mt-3";
    }

    // Validar los datos al enviar el formulario
    formularioRegistro.addEventListener("submit", function(evento) {
        evento.preventDefault();

        const nombreIngresado = nombre.value.trim();
        const correoIngresado = correo.value.trim();
        const contrasenaIngresada = contrasena.value;

        // Validar nombre
        if (nombreIngresado.length < 2) {
            mostrarMensajeRegistro(
                "Escribe tu nombre completo para continuar.",
                "warning"
            );
            nombre.focus();
            return;
        }

        // Validar correo electrónico
        if (!correo.checkValidity() || correoIngresado === "") {
            mostrarMensajeRegistro(
                "Ingresa una dirección de correo electrónico válida.",
                "danger"
            );
            correo.focus();
            return;
        }

        // Validar contraseña
        if (contrasenaIngresada.length < 8) {
            mostrarMensajeRegistro(
                "La contraseña debe tener al menos 8 caracteres.",
                "warning"
            );
            contrasena.focus();
            return;
        }

        // Mostrar confirmación de demostración
        mostrarMensajeRegistro(
            "¡Validación exitosa! Tu formulario está completo. " +
            "Recuerda que la creación real de la cuenta requiere conectarse a un servidor.",
            "success"
        );
    });

    // Limpiar el mensaje cuando se modifiquen los campos
    formularioRegistro.addEventListener("input", function() {
        mensajeRegistro.textContent = "";
        mensajeRegistro.className = "alert d-none mt-3";
    });
</script>
</body>
</html>
