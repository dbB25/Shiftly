
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiftly - Iniciar Sesión</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="img_log/logotipo interfaz.svg"
                     alt="Logo Shiftly"
                     class="logo-shiftly">
                <span>Shiftly</span>
            </a>

            <div class="navbar-links">
                <a href="index.html">Inicio</a>
                <a href="registro.html">Registrarse</a>
            </div>
        </div>
    </header>

    <!-- Formulario de inicio de sesión -->
    <main class="vista-autenticacion">
        <div class="contenedor-autenticacion">

            <div class="tarjeta-autenticacion">
                <div class="encabezado-auth">
                    <p class="etiqueta-resultado">¡BIENVENIDO DE NUEVO!</p>
                    <h1>Iniciar Sesión</h1>
                    <p class="subtitulo-resultado">
                        Accede a tu cuenta para continuar aprendiendo.
                    </p>
                </div>

                <form class="formulario-auth" id="formularioLogin">

                    <div class="campo-auth">
                        <label for="email" class="label-auth">
                            Correo Electrónico
                        </label>

                        <div class="caja-input">
                            <i class="bi bi-envelope icon-input"></i>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="input-auth"
                                placeholder="ejemplo@correo.com"
                                autocomplete="email"
                                required>
                        </div>
                    </div>

                    <div class="campo-auth">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="password" class="label-auth mb-0">
                                Contraseña
                            </label>

                            <a href="recuperar-password.html"
                               class="enlace-secundario">
                                ¿Olvidaste tu contraseña?
                            </a>
                        </div>

                        <div class="caja-input">
                            <i class="bi bi-lock icon-input"></i>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="input-auth"
                                placeholder="Ingresa tu contraseña"
                                autocomplete="current-password"
                                required>

                            <button
                                type="button"
                                id="mostrarPassword"
                                class="btn border-0"
                                aria-label="Mostrar contraseña"
                                aria-pressed="false">
                                <i class="bi bi-eye" id="iconoPassword"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Mensajes del formulario -->
                    <div
                        id="mensajeLogin"
                        class="alert d-none mt-3"
                        role="status"
                        aria-live="polite">
                    </div>

                    <button
                        type="submit"
                        class="btn-resultado btn-siguiente w-100 mt-2">
                        Iniciar Sesión
                    </button>

                </form>

                <div class="pie-auth">
                    <p class="text-muted">
                        ¿Aún no tienes una cuenta?
                        <a href="registro.html" class="enlace-primario">
                            Regístrate aquí
                        </a>
                    </p>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="footer-simple">
        <div class="container d-flex flex-column flex-md-row align-items-center justify-content-between gap-2">
            <p class="mb-0 text-muted small">
                &copy; 2026 Shiftly. Todos los derechos reservados.
            </p>
        </div>
    </footer>

    <!-- Lógica e interactividad -->
    <script>
        const formulario = document.getElementById("formularioLogin");
        const correo = document.getElementById("email");
        const password = document.getElementById("password");
        const botonMostrar = document.getElementById("mostrarPassword");
        const iconoPassword = document.getElementById("iconoPassword");
        const mensaje = document.getElementById("mensajeLogin");

        // Mostrar u ocultar la contraseña
        botonMostrar.addEventListener("click", function () {
            const mostrar = password.type === "password";

            password.type = mostrar ? "text" : "password";
            iconoPassword.className = mostrar
                ? "bi bi-eye-slash"
                : "bi bi-eye";

            botonMostrar.setAttribute(
                "aria-label",
                mostrar ? "Ocultar contraseña" : "Mostrar contraseña"
            );

            botonMostrar.setAttribute("aria-pressed", String(mostrar));
        });

        // Mostrar mensajes en pantalla
        function mostrarMensaje(texto, tipo) {
            mensaje.textContent = texto;
            mensaje.className = "alert mt-3 alert-" + tipo;
        }

        // Validar el formulario
        formulario.addEventListener("submit", function (evento) {
            evento.preventDefault();

            if (!formulario.checkValidity()) {
                formulario.reportValidity();
                return;
            }

            mostrarMensaje(
                "Los campos se completaron correctamente. La autenticación todavía necesita conectarse al servidor.",
                "info"
            );
        });
        
    // Validación en tiempo real de los campos
    [correo, password].forEach(function (campo) {

        
campo.addEventListener("blur", function () {
    if (campo.value.trim() === "") {
        campo.classList.remove("is-valid", "is-invalid");
        return;
    }

    if (campo.checkValidity()) {
        campo.classList.add("is-valid");
        campo.classList.remove("is-invalid");
    } else {
        campo.classList.add("is-invalid");
        campo.classList.remove("is-valid");
    }
});

            // Limpiar el mensaje anterior al modificar los datos
            mensaje.textContent = "";
            mensaje.className = "alert d-none mt-3";
        });

        campo.addEventListener("blur", function () {
    if (campo.value.trim() !== "") {
        campo.classList.toggle("is-valid", campo.validity.valid);
        campo.classList.toggle("is-invalid", !campo.validity.valid);
    } else {
        campo.classList.remove("is-valid", "is-invalid");
    }
});

        
    </script>

</body>
</html>
