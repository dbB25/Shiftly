<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiftly - Mi Perfil</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="img_log/logotipo interfaz.svg" alt="Logo Shiftly" class="logo-shiftly">
                <span>Shiftly</span>
            </a>
            <div class="navbar-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="servicios.html">Aprender</a>
                <a href="glosario.html">Glosario</a>
                <a href="perfil.html" class="active">Mi Perfil</a>
            </div>
        </div>
    </header>

    <main class="vista-perfil">
        <div class="contenedor-perfil">

            <!-- Fila Superior: Datos de Usuario -->
            <div class="tarjeta-resultado d-flex flex-column flex-md-row align-items-center gap-4">
                <div class="avatar-perfil">
                    <i class="bi bi-person-fill"></i>
                </div>
                <div class="info-usuario-encabezado text-center text-md-start">
                    <span class="etiqueta-resultado">USUARIO ACTIVO</span>
                    <h1 class="mb-1">Luis David</h1>
                    <p class="text-muted mb-2">Desarrollador de Software & Estudiante</p>
                    <span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill px-3 py-1">Cuenta Verificada</span>
                </div>
            </div>

            <!-- Fila Inferior: Formulario de Configuración -->
            <div class="tarjeta-resultado">
                <h3 class="titulo-seccion text-start mb-4">Información Personal</h3>

                <form class="formulario-auth">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="nombre-perfil" class="label-auth">Nombre</label>
                            <input type="text" id="nombre-perfil" class="input-auth-simple" value="Luis David">
                        </div>
                        <div class="col-md-6">
                            <label for="apellido-perfil" class="label-auth">Apellidos</label>
                            <input type="text" id="apellido-perfil" class="input-auth-simple" value="Balandrano Delgado">
                        </div>
                        <div class="col-md-12">
                            <label for="email-perfil" class="label-auth">Correo Electrónico</label>
                            <input type="email" id="email-perfil" class="input-auth-simple" value="luis@ejemplo.com" readonly>
                        </div>
                        <div class="col-md-6">
                            <label for="area-perfil" class="label-auth">Área Profesional Principal</label>
                            <select id="area-perfil" class="input-auth-simple">
                                <option selected>Sistemas y Desarrollo</option>
                                <option>Medicina</option>
                                <option>Gastronomía</option>
                                <option>Derecho</option>
                                <option>Arquitectura</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="nivel-perfil" class="label-auth">Nivel de Inglés Estimado</label>
                            <input type="text" id="nivel-perfil" class="input-auth-simple" value="B1 Intermedio" readonly>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-3 mt-4 pt-3 border-top">
                        <button type="button" class="btn-resultado btn-repasar">Cancelar</button>
                        <button type="button" class="btn-resultado btn-siguiente">Guardar Cambios</button>
                    </div>
                </form>
            </div>

        </div>
    </main>

    <footer class="footer-simple">
        <div class="container text-center">
            <p class="mb-0 text-muted small">&copy; 2026 Shiftly. Todos los derechos reservados.</p>
        </div>
    </footer>

</body>

</html>
