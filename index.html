<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiftly - Selección de áreas</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Hoja de estilos -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Barra de navegación -->
    <header>
        <nav class="navbar">
            <div class="container">
                <a class="navbar-brand" href="#">
                    SHIFT
                </a>

                <div class="navbar-links">
                    <a href="#">Inicio</a>
                    <a href="#">Aprender</a>
                    <a href="#">Mi perfil</a>
                    <a href="#">Ayuda</a>
                </div>
            </div>
        </nav>
    </header>

    <!-- Contenido principal -->
    <main>

        <!-- Encabezado de la selección -->
        <section id="seleccion-areas">
            <div class="container">

                <div class="encabezado-areas">
                    <p>ÁREA DE APRENDIZAJE</p>

                    <h1>¿Qué inglés quieres aprender?</h1>

                    <p>
                        Elige un área de aprendizaje para adaptar el contenido
                        a tus intereses y comienza tu camino con SHIFT.
                    </p>
                </div>

                <!-- Aquí estarán las tarjetas -->
                <div id="areas-aprendizaje">
                </div>

                <!-- Botón para continuar -->
                <div class="boton-continuar">
                    <button type="button">
                        Continuar →
                    </button>
                </div>

            </div>
        </section>

    </main>

    <!-- Pie de página -->
    <footer>
        <p>
            En SHIFT creemos que el inglés puede llevarte más lejos.
        </p>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
